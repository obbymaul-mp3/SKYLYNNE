     with its panel drawn here (play.js). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYLYNNE: play it in your browser</title>
<meta name="description" content="The whole SKYLYNNE instrument running in your browser: six self-playing voices, four macro knobs and the physics sequencer.">
<meta name="theme-color" content="#0e0c1e">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../site.css">
<style>
  .play { padding: 28px 0 60px; }
  .stage { display: grid; grid-template-columns: minmax(280px, 480px) 1fr; gap: 28px; align-items: start; }
  .screen { position: relative; }
  #lcd { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 10px; border: 1px solid var(--line); background: #000; display: block; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(14,12,30,.55); border-radius: 10px; backdrop-filter: blur(2px); }
  .start[hidden] { display: none; }
  .panelbox { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
  .knob { touch-action: none; user-select: none; cursor: ns-resize; outline: none; }
  .knob .cap { width: 54px; height: 54px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3a3660, #1c1a38); border: 2px solid var(--line); position: relative; }
  .knob .cap::after { content: ""; position: absolute; left: 50%; top: 5px; width: 3px; height: 14px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; transform-origin: 50% 22px; transform: rotate(var(--a, 0deg)); }
  .knob:focus-visible .cap, .knob.on .cap { border-color: var(--pink); }
  .knob b { display: block; font-size: 11px; letter-spacing: .12em; margin-top: 6px; color: var(--ink2); font-weight: 600; }
  .knob small { display: block; font-size: 10px; color: var(--ink3); }
  .btns { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 16px; }
  .b { font: 600 11px/1 "Sora", sans-serif; letter-spacing: .06em; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 2px; cursor: pointer; user-select: none; touch-action: none; position: relative; }
  .b.l1 { box-shadow: inset 0 0 0 1px #5a4a80; } .b.l2 { background: #3a3470; } .b.l3 { background: var(--pink); color: #1a1022; border-color: var(--pink); }
  .b small { display: block; font-weight: 400; font-size: 9px; color: var(--ink3); margin-top: 4px; letter-spacing: 0; } .b.l3 small { color: #4a2a40; }
  .keys { display: grid; grid-template-columns: repeat(27, 1fr); gap: 3px; margin-top: 16px; }
  .k { aspect-ratio: 1 / 2.4; border-radius: 6px 6px 10px 10px; background: #2a2748; border: 1px solid var(--line); cursor: pointer; position: relative; touch-action: none; user-select: none; }
  .k.blk { background: #15122c; }
  .k.mute::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c); border-radius: 3px; }
  .k i { position: absolute; left: 50%; bottom: 6px; width: 6px; height: 14px; margin-left: -3px; border-radius: 3px; background: #1c1a30; }
  .k.l1 i { background: #4a4070; } .k.l2 i { background: var(--c, var(--lav)); opacity: .55; } .k.l3 i { background: var(--c, var(--yellow)); box-shadow: 0 0 10px var(--c, var(--yellow)); }
  .k small { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 8px; color: var(--ink3); }
  .master { display: flex; gap: 12px; align-items: center; margin-top: 16px; color: var(--ink2); font-size: 12px; letter-spacing: .12em; }
  .master input { flex: 1; accent-color: var(--pink); }
  .hint { color: var(--ink3); font-size: 12px; margin: 14px 0 0; line-height: 1.7; }
  .hint kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px "Sora", sans-serif; color: var(--ink); }
  @media (max-width: 860px) { .stage { grid-template-columns: 1fr; } .keys { gap: 2px; } .k small { display: none; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="container site-header__row">
    <a class="brand" href="../"><i aria-hidden="true"></i>SKYLYNNE</a>
    <nav class="site-nav"><a href="../">About</a><a href="../#install">Install</a></nav>
  </div>
</header>
<main class="play">
  <div class="container stage">
    <div class="screen">
      <canvas id="lcd" width="240" height="240" aria-label="The FM-1's screen"></canvas>
      <div class="start" id="start"><button class="btn btn--primary btn--lg" id="startbtn" type="button">Start the sound</button></div>
      <p class="note" id="status" role="status" style="margin:10px 0 0"></p>
    </div>
    <div>
      <div class="panelbox">
        <div class="knobs" id="knobs"></div>
        <div class="btns" id="btns"></div>
        <div class="keys" id="keys"></div>
        <label class="master"><span>MASTER</span><input id="master" type="range" min="0" max="1023" value="520" aria-label="Master volume"></label>
        <p class="hint">Drag a knob up or down, or scroll over it. Keys: <kbd>H</kbd> home · <kbd>E</kbd> edit · <kbd>Q</kbd> physics · <kbd>Space</kbd> hold · <kbd>−</kbd> <kbd>=</kbd> tempo · <kbd>1</kbd>–<kbd>6</kbd> mute voices · the rows <kbd>Z</kbd>… and <kbd>A</kbd>… play the selected voice · arrow keys turn the knob you last touched, <kbd>Tab</kbd> moves to the next one.</p>
      </div>
    </div>
  </div>
</main>
<script src="play.js"></script>
</body>
</html>
